[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hospitality-ai-optimization"
version = "0.1.0"
description = "Sample AI Hospitality Optimization & Strategy module."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "crewai>=0.98.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "python-dotenv>=1.0.0",
  "langchain>=1.2.18",
  "fastapi>=0.115.0",
  "markdown>=3.10.2",
  "pytest>=8.0.0",
  "mcp>=1.6.0","ruff>=0.6.0", "mypy>=1.10.0", "uvicorn>=0.30.0"
]

[project.scripts]
hospitality-ai = "hospitality_ai.interfaces.cli:main"
hospitality-trip-mcp = "hospitality_ai.infrastructure.mcp.trip_price_server:main"

[project.optional-dependencies]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
